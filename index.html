<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mesure Caméra PWA</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#2563eb">
</head>
<body>
  <div id="container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    
    <!-- Panneau de contrôle placé en HAUT -->
    <div id="controls">
      <div id="info">1. Marquez la largeur de l'étalon (Carte = 8.56 cm)</div>
      <div class="actions">
        <button id="btnCapture" class="btn">📷 Prendre Photo</button>
        <button id="btnReset" class="btn btn-secondary">Réinitialiser</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
