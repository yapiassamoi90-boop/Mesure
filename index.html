<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mesure Caméra PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: white; overflow: hidden; }
    #container { position: relative; width: 100vw; height: 100vh; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    #controls {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      width: 90%; max-width: 400px; background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px); padding: 15px; border-radius: 16px; text-align: center;
    }
    .btn { background: #2563eb; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; margin: 4px; cursor: pointer; }
    .btn-secondary { background: #475569; }
    #info { font-size: 0.95rem; margin-bottom: 8px; color: #cbd5e1; }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <div id="controls">
      <div id="info">1. Marquez la largeur de l'étalon (ex: Carte = 8.56 cm)</div>
      <button id="btnReset" class="btn btn-secondary">Réinitialiser</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
